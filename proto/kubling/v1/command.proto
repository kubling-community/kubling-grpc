syntax = "proto3";

package kubling.v1;

option go_package = "github.com/kubling-community/kubling-grpc/sdk-go/gen/kubling/v1;kublingv1";
option java_multiple_files = true;
option java_package = "com.kubling.transport.grpc";
option java_outer_classname = "CommandProto";

// ============================================================================
// Kubling gRPC Public API
// ============================================================================

service SessionService {

  rpc Login(LoginRequest)
      returns (LoginResponse);

  rpc Logout(LogoutRequest)
      returns (LogoutResponse);

  rpc Ping(PingRequest)
      returns (PingResponse);

  rpc PingSession(SessionPingRequest)
      returns (SessionPingResponse);
}

message LoginRequest {
  string vdb_name = 1;
  string vdb_version = 2;

  string username = 3;
  string password = 4;

  string application_name = 5;

  map<string, string> properties = 10;
}

message LoginResponse {
  string expiring_token = 1;
  int64 expires_at = 2;
  string session_id = 3;
  string username = 4;

  string vdb_name = 5;
  string vdb_version = 6;

  string cluster_name = 7;
  string timezone = 8;

  map<string, string> properties = 10;
}

message LogoutRequest {
  string expiring_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message PingRequest {
}

message PingResponse {
  bool ok = 1;
}

message SessionPingRequest {
  string expiring_token = 1;
  string session_id = 2;
}

message SessionPingResponse {
  bool valid = 1;
}

// Main SQL execution service.
//
// This service provides the portable public API surface for:
// - SQL execution
// - SQL querying
// - Transactions
//
// Internally, requests are mapped to the existing Kubling engine request model.
service QueryService {

  // Executes INSERT, UPDATE, DELETE and DDL statements.
  rpc Exec(ExecRequest) returns (ExecResponse);

  // Executes a SQL query and streams result batches.
  rpc Query(QueryRequest) returns (stream QueryBatch);

  // Starts a transaction and returns a transaction identifier.
  rpc BeginTransaction(BeginTransactionRequest)
      returns (BeginTransactionResponse);

  // Commits a transaction.
  rpc CommitTransaction(CommitTransactionRequest)
      returns (CommitTransactionResponse);

  // Rolls back a transaction.
  rpc RollbackTransaction(RollbackTransactionRequest)
      returns (RollbackTransactionResponse);

  rpc IsInTransaction(IsInTransactionRequest)
      returns (IsInTransactionResponse);

  // Returns server metadata and capabilities.
  rpc GetServerInfo(GetServerInfoRequest)
      returns (GetServerInfoResponse);
}

// ============================================================================
// Value Types
// ============================================================================

// Canonical Kubling logical types.
// These values represent logical engine-level semantic types.
enum ValueType {

  // Unspecified type.
  VALUE_TYPE_UNKNOWN = 0;

  // Variable-length character string.
  VALUE_TYPE_STRING = 1;

  // Variable-length binary value.
  VALUE_TYPE_VARBINARY = 2;

  // Single UTF-16 character.
  VALUE_TYPE_CHAR = 3;

  // Boolean value.
  VALUE_TYPE_BOOLEAN = 4;

  // Signed 8-bit integer.
  VALUE_TYPE_BYTE = 5;

  // Signed 16-bit integer.
  VALUE_TYPE_SHORT = 6;

  // Signed 32-bit integer.
  VALUE_TYPE_INTEGER = 7;

  // Signed 64-bit integer.
  VALUE_TYPE_LONG = 8;

  // Arbitrary precision integer.
  VALUE_TYPE_BIGINTEGER = 9;

  // 32-bit floating-point number.
  VALUE_TYPE_FLOAT = 10;

  // 64-bit floating-point number.
  VALUE_TYPE_DOUBLE = 11;

  // Arbitrary precision decimal.
  VALUE_TYPE_BIGDECIMAL = 12;

  // Calendar date.
  VALUE_TYPE_DATE = 13;

  // Local time.
  VALUE_TYPE_TIME = 14;

  // Timestamp with fractional seconds.
  VALUE_TYPE_TIMESTAMP = 15;

  // Binary large object.
  VALUE_TYPE_BLOB = 16;

  // Character large object.
  VALUE_TYPE_CLOB = 17;

  // Geospatial geometry object.
  //
  // Encoded using WKB (Well-Known Binary).
  VALUE_TYPE_GEOMETRY = 18;

  // Geospatial geography object.
  //
  // Encoded using WKB (Well-Known Binary).
  VALUE_TYPE_GEOGRAPHY = 19;

  // JSON document.
  VALUE_TYPE_JSON = 20;

  // XML document.
  VALUE_TYPE_XML = 21;
}

// Explicit null representation.
message NullValue {}

// Generic typed value.
//
// The "type" field defines the logical Kubling semantic type.
//
// The concrete wire representation may reuse protobuf primitives.
//
// Examples:
// - VALUE_TYPE_BIGDECIMAL -> decimal_value
// - VALUE_TYPE_TIMESTAMP -> timestamp_value
// - VALUE_TYPE_BLOB -> bytes_value
message Value {

  oneof kind {

    NullValue null_value = 1;

    string string_value = 2;      // string / varchar
    bytes varbinary_value = 3;    // varbinary

    string char_value = 4;        // exactly one BMP char

    bool boolean_value = 5;

    int32 byte_value = 6;         // byte / tinyint, validated -128..127
    int32 short_value = 7;        // short / smallint, validated -32768..32767
    int32 integer_value = 8;      // integer / serial
    int64 long_value = 9;         // long / bigint

    string biginteger_value = 10; // arbitrary precision integer

    float float_value = 11;       // float / real
    double double_value = 12;     // double

    string bigdecimal_value = 13; // bigdecimal / decimal

    string date_value = 14;       // ISO date: yyyy-MM-dd
    string time_value = 15;       // ISO local time: HH:mm:ss[.n]
    string timestamp_value = 16;  // ISO local timestamp: yyyy-MM-ddTHH:mm:ss[.n]

    BlobValue blob_value = 17;
    ClobValue clob_value = 18;

    string xml_value = 19;        // deprecated
    bytes geometry_value = 20;
    bytes geography_value = 21;

    string json_value = 22;
  }
}

message BlobValue {
  bytes data = 1;
}

message ClobValue {
  string data = 1;
}

// ============================================================================
// Parameters
// ============================================================================

// Positional SQL parameter.
message Parameter {

  // Parameter value.
  Value value = 1;
}

// ============================================================================
// Exec
// ============================================================================

// SQL execution request.
//
// Intended for:
// - INSERT
// - UPDATE
// - DELETE
message ExecRequest {

  string expiring_token = 1;

  // SQL statement.
  string sql = 2;

  // Positional SQL parameters.
  repeated Parameter params = 3;

  bool returnGeneratedKeys = 4;
}

// SQL execution response.
message ExecResponse {

  int64 affected_rows = 1;

  repeated int64 update_counts = 2;

  optional QueryBatch generated_keys = 3;
}

// ============================================================================
// Query
// ============================================================================

// SQL query request.
message QueryRequest {

  string expiring_token = 1;

  string session_id = 2;

  // SQL query string.
  string sql = 3;

  // Positional SQL parameters.
  repeated Parameter params = 4;

  // Suggested batch size for streamed results.
  //
  // The server may ignore or adjust this value.
  int32 batch_size = 5;
}

// Result column metadata.
message Column {

  // Column name.
  string name = 1;

  string data_type = 2;

  // Indicates whether the column allows null values.
  bool nullable = 3;

  int32 precision = 4;

  int32 scale = 5;

}

// Result row.
message Row {

  // Positional row values.
  repeated Value values = 1;
}

// Streamed query batch.
message QueryBatch {

  // Returned columns metadata.
  //
  // Typically sent in the first batch.
  repeated Column columns = 1;

  // Batch rows.
  repeated Row rows = 2;

}

// ============================================================================
// Transactions
// ============================================================================

// Transaction start request.
message BeginTransactionRequest {
  string expiring_token = 1;
}

// Transaction start response.
message BeginTransactionResponse {
}

// Transaction commit request.
message CommitTransactionRequest {
  string expiring_token = 1;
}

// Transaction commit response.
message CommitTransactionResponse {
  bool success = 1;
}

// Transaction rollback request.
message RollbackTransactionRequest {
  string expiring_token = 1;
}

// Transaction rollback response.
message RollbackTransactionResponse {
  bool success = 1;
}

message IsInTransactionRequest {
  string expiring_token = 1;
}

message IsInTransactionResponse {
  bool active = 1;
}

// ============================================================================
// Server Metadata
// ============================================================================

// Server metadata request.
message GetServerInfoRequest {}

// Server metadata response.
message GetServerInfoResponse {

  // Kubling server version.
  //
  // Example:
  // "26.3.1"
  string server_version = 1;

  // Supported optional or configured features.
  repeated string features = 2;
}