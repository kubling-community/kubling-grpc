syntax = "proto3";

package kubling.v1;

import "kubling/v1/capability.proto";
import "kubling/v1/transaction.proto";
// Preserves transitive access to value types previously declared in this file.
// buf:lint:ignore IMPORT_NO_PUBLIC
import public "kubling/v1/value.proto";

option go_package = "github.com/kubling-community/kubling-grpc/sdk-go/kubling/v1;kublingv1";
option java_multiple_files = true;
option java_outer_classname = "CommandProto";
option java_package = "com.kubling.transport.grpc";

// ============================================================================
// Kubling gRPC Public API
// ============================================================================

service SessionService {
  rpc Login(LoginRequest) returns (LoginResponse);

  rpc Logout(LogoutRequest) returns (LogoutResponse);

  rpc Ping(PingRequest) returns (PingResponse);

  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc PingSession(SessionPingRequest) returns (SessionPingResponse);
}

message LoginRequest {
  string vdb_name = 1;
  string vdb_version = 2;

  string username = 3;
  string password = 4;

  string application_name = 5;

  map<string, string> properties = 10;
}

message LoginResponse {
  string expiring_token = 1;
  int64 expires_at = 2;
  string session_id = 3;
  string username = 4;

  string vdb_name = 5;
  string vdb_version = 6;

  string cluster_name = 7;
  string timezone = 8;

  map<string, string> properties = 10;

  Affinity affinity = 11;
}

message LogoutRequest {
  string expiring_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message PingRequest {}

message PingResponse {
  bool ok = 1;
}

message SessionPingRequest {
  string expiring_token = 1;
  string session_id = 2;
}

message SessionPingResponse {
  bool valid = 1;
}

// Main SQL execution service.
//
// This service provides the portable public API surface for:
// - SQL execution
// - SQL querying
// - Transactions
//
// Internally, requests are mapped to the existing Kubling engine request model.
service QueryService {
  // Executes INSERT, UPDATE, DELETE and DDL statements.
  rpc Exec(ExecRequest) returns (ExecResponse);

  // Executes a SQL query and streams result batches.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Query(QueryRequest) returns (stream QueryBatch);

  // Executes SQL once and reports its actual result kind. Requires
  // generic_execute_v1; never probe statement kind by trying another SQL RPC.
  rpc Execute(ExecuteRequest) returns (stream ExecuteResponse);

  // Starts a transaction and returns a transaction identifier.
  rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);

  // Commits a transaction.
  rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);

  // Rolls back a transaction.
  rpc RollbackTransaction(RollbackTransactionRequest) returns (RollbackTransactionResponse);

  rpc IsInTransaction(IsInTransactionRequest) returns (IsInTransactionResponse);

  // Optional authoritative observation, gated by transaction_status_v1.
  rpc GetTransactionStatus(GetTransactionStatusRequest) returns (GetTransactionStatusResponse);

  // Returns server metadata and capabilities.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
}

// ============================================================================
// Parameters
// ============================================================================

// Positional SQL parameter.
message Parameter {
  // Parameter value.
  Value value = 1;

  // Absent preserves legacy inference, including legacy untyped null.
  // Present requires typed_parameters_v1 and a value consistent with the type.
  TypeDescriptor declared_type = 2;
}

// ============================================================================
// Exec
// ============================================================================

// SQL execution request.
//
// Intended for:
// - INSERT
// - UPDATE
// - DELETE
message ExecRequest {
  string expiring_token = 1;

  // SQL statement.
  string sql = 2;

  // Positional SQL parameters.
  repeated Parameter params = 3;

  // buf:lint:ignore FIELD_LOWER_SNAKE_CASE
  bool returnGeneratedKeys = 4;

  // Optional assertion of the session's active transaction. Empty preserves
  // legacy session semantics. Requires transaction_ids_v1 when non-empty.
  string transaction_id = 5;
}

// SQL execution response.
message ExecResponse {
  int64 affected_rows = 1;

  repeated int64 update_counts = 2;

  optional QueryBatch generated_keys = 3;
}

// ============================================================================
// Query
// ============================================================================

// SQL query request.
message QueryRequest {
  string expiring_token = 1;

  string session_id = 2;

  // SQL query string.
  string sql = 3;

  // Positional SQL parameters.
  repeated Parameter params = 4;

  // Suggested batch size for streamed results.
  //
  // The server may ignore or adjust this value.
  int32 batch_size = 5;

  // Same semantics as ExecRequest.transaction_id.
  string transaction_id = 6;
}

// Result column metadata.
message Column {
  // Column name.
  string name = 1;

  string data_type = 2;

  // Indicates whether the column allows null values.
  bool nullable = 3;

  int32 precision = 4;

  int32 scale = 5;

  // Required in Execute schemas; legacy data_type remains unchanged.
  TypeDescriptor declared_type = 6;
}

// Result row.
message Row {
  // Positional row values.
  repeated Value values = 1;
}

// Streamed query batch.
message QueryBatch {
  // Returned columns metadata.
  //
  // Typically sent in the first batch.
  repeated Column columns = 1;

  // Batch rows.
  repeated Row rows = 2;
}

// ============================================================================
// Generic execution (generic_execute_v1)
// ============================================================================

message ExecuteRequest {
  string expiring_token = 1;
  string sql = 2;
  repeated Parameter params = 3;
  // Empty inherits the session's transaction semantics; non-empty asserts the
  // active transaction's opaque ID and requires transaction_ids_v1.
  string transaction_id = 4;
  // Zero uses the server default; positive values are upper bounds, not hints.
  uint32 batch_size = 5;
  // Requires advertised AND accepted generated_keys_v1; checked before SQL.
  bool return_generated_keys = 6;
  // Obtained from authenticated GetServerInfo. Required and checked before SQL.
  string capability_id = 7;
  // Explicit opt-in to output representations/multiple results. Input variants
  // and declared_type activate their features by presence, not by this list.
  // See protocol/features.json. Unknown/unavailable features fail before SQL.
  repeated string accepted_features = 8;
}

// Ordered event stream; see docs/client-contract-v1.md for the state machine.
// Unknown/missing event alternatives are not successful or skippable results.
message ExecuteResponse {
  oneof event {
    ResultSetStart result_set_start = 1;
    ResultRows result_rows = 2;
    UpdateResult update_result = 3;
    ResultSetEnd result_set_end = 4;
    ExecutionEnd execution_end = 5;
  }
}

enum ResultSetRole {
  RESULT_SET_ROLE_UNSPECIFIED = 0;
  RESULT_SET_ROLE_QUERY = 1;
  RESULT_SET_ROLE_GENERATED_KEYS = 2;
}

message ResultSetStart {
  // Consecutive IDs starting at 1, including update results and generated keys.
  uint64 result_id = 1;
  repeated Column columns = 2;
  ResultSetRole role = 3;
  // Present only for generated keys; identifies the preceding UpdateResult.
  optional uint64 parent_result_id = 4;
}

message ResultRows {
  uint64 result_id = 1;
  repeated Row rows = 2;
}

message UnknownUpdateCount {}

// Zero affected rows is a known count, distinct from an unknown count.
message UpdateCount {
  oneof value {
    uint64 affected_rows = 1;
    UnknownUpdateCount unknown = 2;
  }
}

// Complete update result. Counts preserve engine order and are non-empty.
// This message does not introduce batch SQL submission or atomicity guarantees.
// DDL, SET and other commands without a natural row set also use UpdateResult;
// if no reliable count exists, use UnknownUpdateCount rather than inventing zero.
message UpdateResult {
  uint64 result_id = 1;
  repeated UpdateCount counts = 2;
}

message ResultSetEnd {
  uint64 result_id = 1;
  uint64 row_count = 2;
}

// Exactly once on success, after all results. Successful completion also
// requires final gRPC OK; a broken stream must not be treated as success.
// Successful autocommit reports NONE with an empty transaction ID. Cancellation
// or error emits no ExecutionEnd; propagate cancellation and close execution
// resources. A race after completion may still lose the final transport status.
message ExecutionEnd {
  uint64 result_count = 1;
  TransactionStatus transaction = 2;
}

// ============================================================================
// Transactions
// ============================================================================

// Transaction start request.
message BeginTransactionRequest {
  string expiring_token = 1;
}

// Transaction start response.
message BeginTransactionResponse {
  // Returned when transaction_ids_v1 is supported. IDs are never reused.
  string transaction_id = 1;
  Affinity affinity = 2;
}

// Transaction commit request.
message CommitTransactionRequest {
  string expiring_token = 1;
  // Empty preserves legacy behavior. A non-empty stale ID must fail before
  // committing anything, even if a different transaction is now active.
  string transaction_id = 2;
}

// Transaction commit response.
message CommitTransactionResponse {
  bool success = 1;
  TransactionStatus transaction = 2;
}

// Transaction rollback request.
message RollbackTransactionRequest {
  string expiring_token = 1;
  string transaction_id = 2;
}

// Transaction rollback response.
message RollbackTransactionResponse {
  // No active transaction: successful idempotent no-op, NONE with empty ID.
  // This does not establish the outcome of a historical explicit request ID.
  bool success = 1;
  TransactionStatus transaction = 2;
}

message IsInTransactionRequest {
  string expiring_token = 1;
}

message IsInTransactionResponse {
  bool active = 1;
  // Optional additional observation. active=false alone proves no outcome.
  TransactionStatus transaction = 2;
}

message GetTransactionStatusRequest {
  string expiring_token = 1;
  // Required non-empty ID; unknown/expired lookups preserve it in UNKNOWN.
  string transaction_id = 2;
}

message GetTransactionStatusResponse {
  TransactionStatus transaction = 1;
}

// ============================================================================
// Server Metadata
// ============================================================================

// Server metadata request.
message GetServerInfoRequest {
  // Empty preserves legacy product information. Effective new capabilities
  // require an authenticated session and must describe its VDB and node.
  string expiring_token = 1;
}

// Server metadata response.
message GetServerInfoResponse {
  // Kubling server version.
  //
  // Example:
  // "26.3.1"
  string server_version = 1;

  // Supported optional or configured features.
  repeated string features = 2;

  Capabilities capabilities = 3;
}
