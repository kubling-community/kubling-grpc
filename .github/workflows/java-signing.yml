name: Java signing check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up GraalVM 25
        uses: actions/setup-java@v5
        with:
          distribution: graalvm
          java-version: '25'
          cache: maven
      - name: Verify build JDK and target release
        run: bash tools/check_java_build.sh
      - name: Validate coordinated version
        run: python3 tools/check_release.py all
      - name: Build, test and sign without deployment
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          test -n "$MAVEN_GPG_KEY" || { echo 'Missing MAVEN_GPG_PRIVATE_KEY'; exit 1; }
          test -n "$MAVEN_GPG_PASSPHRASE" || { echo 'Missing MAVEN_GPG_PASSPHRASE'; exit 1; }
          ./mvnw --batch-mode --no-transfer-progress -f sdk-java/pom.xml -Prelease -Dgpg.useagent=false clean verify
      - name: Inspect packages and verify signatures with the published public key
        run: |
          python3 tools/check_packages.py java
          python3 tools/check_java_signatures.py
