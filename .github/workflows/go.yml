name: Go SDK

on:
  push:
    branches:
      - main
    tags:
      - 'sdk-go/v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Generate, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/check_release.py go "${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor HEAD origin/main

      - name: Validate coordinated version
        run: |
          python3 tools/check_release.py all
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            python3 tools/check_release.py train HEAD
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: sdk-go/go.sum

      - name: Install generation tools
        run: bash tools/bootstrap.sh

      - name: Generate Go SDK
        run: |
          bash generate.sh go
          python3 tools/generate_features.py --language rust

      - name: Tidy Go module
        working-directory: sdk-go
        run: go mod tidy

      - name: Verify generated sources are up to date
        run: |
          python3 tools/generate_features.py --check --language go
          python3 tools/generate_features.py --check --language rust
          if ! git diff --exit-code -- sdk-go sdk-rust/features; then
            echo "::error::Generated Go sources or module files are not up to date."
            echo "::error::Run generate.sh and 'go mod tidy' locally, then commit the changes."
            exit 1
          fi
          if [[ -n "$(git ls-files --others --exclude-standard -- sdk-go/kubling sdk-go/features sdk-rust/features)" ]]; then
            echo "::error::New generated Go/Rust files must be committed."
            exit 1
          fi

      - name: Validate feature registry and semantic cases
        run: python3 -B -m unittest discover -s tools/tests -v

      - name: Build
        working-directory: sdk-go
        run: go build ./...

      - name: Test packages without Docker-backed contracts
        working-directory: sdk-go
        run: |
          mapfile -t packages < <(go list ./... | grep -v '/tests/contracts$')
          go test -race "${packages[@]}"

      - name: Optionally authenticate Docker Hub pulls
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::notice::Docker Hub credentials are not configured; using anonymous public pulls."
            exit 0
          fi
          if ! printf '%s' "${DOCKERHUB_TOKEN}" | docker login docker.io \
            --username "${DOCKERHUB_USERNAME}" --password-stdin; then
            echo "::warning::Docker Hub authentication failed; continuing with anonymous public pulls."
            docker logout docker.io >/dev/null 2>&1 || true
          fi

      - name: Test Docker-backed contracts
        working-directory: sdk-go
        run: go test -race ./tests/contracts
