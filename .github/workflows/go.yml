name: Go SDK

on:
  push:
    branches:
      - main
    tags:
      - 'sdk-go/v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Generate, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^sdk-go/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${RELEASE_TAG} is not a valid Go SDK semantic version tag."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: sdk-go/go.sum

      - name: Install generation tools
        run: bash tools/bootstrap.sh

      - name: Generate Go SDK
        run: |
          bash generate.sh go
          python3 tools/generate_features.py --language rust

      - name: Tidy Go module
        working-directory: sdk-go
        run: go mod tidy

      - name: Verify generated sources are up to date
        run: |
          python3 tools/generate_features.py --check --language go
          python3 tools/generate_features.py --check --language rust
          if ! git diff --exit-code -- sdk-go sdk-rust/features; then
            echo "::error::Generated Go sources or module files are not up to date."
            echo "::error::Run generate.sh and 'go mod tidy' locally, then commit the changes."
            exit 1
          fi
          if [[ -n "$(git ls-files --others --exclude-standard -- sdk-go/kubling sdk-go/features sdk-rust/features)" ]]; then
            echo "::error::New generated Go/Rust files must be committed."
            exit 1
          fi

      - name: Validate feature registry and semantic cases
        run: python3 -B -m unittest discover -s tools/tests -v

      - name: Build
        working-directory: sdk-go
        run: go build ./...

      - name: Test
        working-directory: sdk-go
        run: go test -race ./...

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/sdk-go/v')
    needs:
      - validate

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "Go SDK ${GITHUB_REF_NAME#sdk-go/}"
