name: Go SDK

on:
  push:
    branches:
      - main
    tags:
      - 'sdk-go/v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Generate, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: sdk-go/go.sum

      - name: Install generation tools
        run: bash tools/bootstrap.sh

      - name: Generate Go SDK
        run: bash generate.sh

      - name: Tidy Go module
        working-directory: sdk-go
        run: go mod tidy

      - name: Verify generated sources are up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated Go sources or module files are not up to date."
            echo "::error::Run generate.sh and 'go mod tidy' locally, then commit the changes."
            exit 1
          fi

      - name: Build
        working-directory: sdk-go
        run: go build ./...

      - name: Test
        working-directory: sdk-go
        run: go test -race ./...

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/sdk-go/v')
    needs:
      - validate

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "Go SDK ${GITHUB_REF_NAME#sdk-go/}"